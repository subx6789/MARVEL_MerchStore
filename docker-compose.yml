# ═══════════════════════════════════════════════════════════
# MARVEL MerchStore — Docker Compose
# One-command local development setup
# ═══════════════════════════════════════════════════════════

services:
  # ── Next.js Application ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marvel-merchstore-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - marvel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL (Local Dev / Offline Mode) ────────────────
  # NOTE: If using hosted Supabase, you can remove this service
  # and point DATABASE_URL directly to Supabase's connection string
  db:
    image: postgres:16-alpine
    container_name: marvel-merchstore-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-MarvelMerch2025Secure}
      - POSTGRES_DB=marvel_merchstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - marvel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marvel_merchstore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: marvel-merchstore-pgdata

networks:
  marvel-network:
    name: marvel-network
    driver: bridge
